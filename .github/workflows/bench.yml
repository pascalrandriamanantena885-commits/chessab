name: Bench (nps sy depth)
on: workflow_dispatch

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          F=$(ls project*.tgz 2>/dev/null | sort -V | tail -1)
          if [ -z "$F" ]; then echo "::error::Tsy hita ny project*.tgz"; ls -la; exit 1; fi
          echo "Mampiasa $F"
          tar xzf "$F"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Compile
        run: mkdir cls && javac -d cls app/src/main/java/mg/chess/offline/own/*.java tools/Bench.java

      - name: Bench
        run: |
          java -cp cls mg.chess.offline.own.Bench 9 60 | tee bench.txt
          {
            echo '### JORO bench'
            echo '```'
            grep BENCH bench.txt
            echo '```'
            echo "nproc=$(nproc)"
          } >> "$GITHUB_STEP_SUMMARY"
