name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          F="$(ls project*.tgz 2>/dev/null | sort -V | tail -1)"
          if [ -z "$F" ]; then echo "Tsy hita ny project*.tgz ao amin'ny fototry ny repo"; ls -la; exit 1; fi
          echo "Mampiasa $F"
          tar xzf "$F"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build Stockfish 17.1 (Android arm64, NDK, NNUE)
        run: |
          git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          cd Stockfish/src
          # Misy fichier NNUE (nets) tsy maintsy alaina aloha (embedded ao anaty binary)
          make net
          ls -lh *.nnue
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk
          llvm-strip stockfish
          ls -lh stockfish
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp stockfish ../../app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KAJY-debug-apk
          path: app/build/outputs/apk/debug/*.apk
