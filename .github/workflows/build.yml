name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          # Maka ny rakitra project*.tgz vaovao indrindra eo amin'ny fototry ny repo
          f=$(ls project*.tgz 2>/dev/null | sort -V | tail -n1)
          if [ -z "$f" ]; then
            echo "Tsy hita ny project*.tgz eo amin'ny fototry ny repo. Rakitra misy:"
            ls -la
            exit 1
          fi
          echo "Mampiasa: $f"
          tar xzf "$f"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build Stockfish 19 (Android arm64, NDK, NNUE)
        run: |
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          cd Stockfish/src
          # Fetra Elo (UCI_Elo) ao amin'ity version ity: jereo ao amin'ny log, ampitahao amin'ny SF_MIN_ELO / SF_MAX_ELO ao amin'ny Bots.kt
          grep -rn "LowestElo\|HighestElo" *.h *.cpp || true
          # Fichier NNUE (nets): alaina aloha (embedded ao anaty binary)
          make net || true
          ls -lh *.nnue || true
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk
          llvm-strip stockfish
          ls -lh stockfish
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp stockfish ../../app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KAJY-debug-apk
          path: app/build/outputs/apk/debug/*.apk
