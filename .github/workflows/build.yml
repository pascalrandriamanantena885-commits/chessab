name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          F=$(ls project*.tgz 2>/dev/null | sort -V | tail -1)
          if [ -z "$F" ]; then
            echo "::error::Tsy hita ny project*.tgz ao amin'ny fototry ny repo"; ls -la; exit 1
          fi
          echo "Mampiasa $F"
          tar xzf "$F"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build Stockfish 19 (Android arm64, NDK, NNUE)
        run: |
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          cd Stockfish/src
          # Fetra Elo (UCI_Elo) ao amin'ity version ity: jereo ao amin'ny log, ampitahao amin'ny SF_MIN_ELO / SF_MAX_ELO ao amin'ny Bots.kt
          grep -rn "LowestElo\|HighestElo" *.h *.cpp || true
          # NNUE: alain'ny Makefile ho azy mandritra ny build (embedded ao anaty binary)
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk
          llvm-strip stockfish
          ls -lh stockfish
          file stockfish
          # Raha kely loatra (< 5 MB) dia tsy voapetraka ny net NNUE
          test "$(stat -c%s stockfish)" -gt 5000000 || { echo "::error::Stockfish kely loatra - tsy misy net NNUE?"; exit 1; }
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp stockfish ../../app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Build Stockfish dotprod (ARMv8.2+, haingana kokoa) (tsy voatery)
        continue-on-error: true
        run: |
          set -e
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          cd Stockfish/src
          make clean
          make -j"$(nproc)" build ARCH=armv8-dotprod COMP=ndk
          llvm-strip stockfish
          ls -lh stockfish
          file stockfish
          test "$(stat -c%s stockfish)" -gt 5000000
          cp stockfish ../../app/src/main/jniLibs/arm64-v8a/libstockfish_dp.so

      - name: Build Berserk (Android arm64, NDK, NNUE) (tsy voatery)
        continue-on-error: true
        run: |
          set -e
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          git clone --depth 1 https://github.com/jhonnold/berserk.git
          cd berserk/src
          # Anaran'ny net: alaina avy ao amin'ny Makefile
          grep -n "EVALFILE\|\.nn" Makefile | head -20 || true
          NN=$(grep -oE 'berserk-[0-9a-f]+\.nn' Makefile | head -1)
          echo "Net: $NN"
          if [ -z "$NN" ]; then echo "::error::Tsy hita ny anaran'ny net Berserk"; exit 1; fi
          if [ ! -f "$NN" ]; then
            curl -fL -o "$NN" "https://github.com/jhonnold/berserk-networks/raw/main/$NN"
          fi
          ls -lh "$NN"
          # Compile mivantana amin'ny NDK clang (tsy mampiasa -march=native an'ny Makefile)
          aarch64-linux-android24-clang -O3 -std=gnu11 -DNDEBUG -pthread \
            -DEVALFILE=\"$NN\" *.c -lm -o berserk
          llvm-strip berserk
          ls -lh berserk
          file berserk
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp berserk ../../app/src/main/jniLibs/arm64-v8a/libberserk.so

      - name: Fanamarinana binary
        run: |
          ls -lh app/src/main/jniLibs/arm64-v8a/
          [ -f app/src/main/jniLibs/arm64-v8a/libstockfish_dp.so ] \
            && echo "Stockfish dotprod: MISY" \
            || echo "::warning::Stockfish dotprod: TSY MISY - binary mahazatra ihany no ampiasaina"
          [ -f app/src/main/jniLibs/arm64-v8a/libberserk.so ] \
            && echo "Berserk: MISY (Hybrid mandeha)" \
            || echo "::warning::Berserk: TSY MISY - Stockfish ihany no mandeha (Hybrid miala)"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # Release (minify + signing). Mila GitHub Secrets: KS_BASE64, KS_PASS, KEY_ALIAS, KEY_PASS
      # Raha tsy misy secrets dia sonia amin'ny debug key (azo apetraka fa tsy azo ampiasaina amin'ny Play Store).
      - name: Decode keystore
        env: { KS_BASE64: "${{ secrets.KS_BASE64 }}" }
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=${{ secrets.KS_PASS }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${{ secrets.KEY_PASS }}" >> "$GITHUB_ENV"
          fi

      - name: Build release APK (minified)
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KAJY-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
