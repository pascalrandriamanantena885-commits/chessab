name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Foanana ny run taloha raha misy push vaovao amin'ny branch iray
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JNI_DIR: app/src/main/jniLibs/arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          F=$(ls project*.tgz 2>/dev/null | sort -V | tail -1)
          if [ -z "$F" ]; then
            echo "::error::Tsy hita ny project*.tgz ao amin'ny fototry ny repo"; ls -la; exit 1
          fi
          echo "Mampiasa $F"
          tar xzf "$F"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # ---------- Stockfish (cache: tsy atao build indray raha tsy niova ny commit / NDK) ----------
      - name: Resolve Stockfish + NDK version
        id: ver
        run: |
          SF_SHA=$(git ls-remote https://github.com/official-stockfish/Stockfish.git sf_19 | head -1 | cut -f1)
          [ -n "$SF_SHA" ] || { echo "::error::Tsy hita ny ref sf_19"; exit 1; }
          NDK=$(basename "$(readlink -f "$ANDROID_NDK_LATEST_HOME")")
          echo "key=sf19-${SF_SHA}-ndk-${NDK}" >> "$GITHUB_OUTPUT"
          echo "Stockfish $SF_SHA / NDK $NDK"

      - name: Restore Stockfish binaries
        id: sfcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.JNI_DIR }}
          key: ${{ steps.ver.outputs.key }}

      - name: Build Stockfish 19 (Android arm64, NDK, NNUE)
        if: steps.sfcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd Stockfish/src
          # Fetra Elo (UCI_Elo): ampitahao amin'ny SF_MIN_ELO / SF_MAX_ELO ao amin'ny Bots.kt
          grep -rn "LowestElo\|HighestElo" *.h *.cpp || true
          make -j"$(nproc)" build ARCH=armv8 COMP=ndk
          llvm-strip stockfish
          ls -lh stockfish; file stockfish
          # Kely loatra (< 5 MB) = tsy voapetraka ny net NNUE
          test "$(stat -c%s stockfish)" -gt 5000000 || { echo "::error::Stockfish kely loatra - tsy misy net NNUE?"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/$JNI_DIR"
          cp stockfish "$GITHUB_WORKSPACE/$JNI_DIR/libstockfish.so"

      - name: Build Stockfish dotprod (ARMv8.2+, haingana kokoa) (tsy voatery)
        if: steps.sfcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -e
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd Stockfish/src
          make clean
          make -j"$(nproc)" build ARCH=armv8-dotprod COMP=ndk
          llvm-strip stockfish
          ls -lh stockfish; file stockfish
          test "$(stat -c%s stockfish)" -gt 5000000
          cp stockfish "$GITHUB_WORKSPACE/$JNI_DIR/libstockfish_dp.so"

      # Tehirizina ihany rehefa vita ny binary roa (mba tsy ho tazonina foana ny dotprod tsy nahomby)
      - name: Save Stockfish binaries
        if: steps.sfcache.outputs.cache-hit != 'true' && hashFiles('app/src/main/jniLibs/arm64-v8a/libstockfish_dp.so') != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.JNI_DIR }}
          key: ${{ steps.ver.outputs.key }}

      - name: Fanamarinana binary
        run: |
          ls -lh "$JNI_DIR"
          test -f "$JNI_DIR/libstockfish.so" || { echo "::error::libstockfish.so tsy hita"; exit 1; }
          [ -f "$JNI_DIR/libstockfish_dp.so" ] \
            && echo "Stockfish dotprod: MISY" \
            || echo "::warning::Stockfish dotprod: TSY MISY - binary mahazatra ihany no ampiasaina"

      # ---------- Gradle ----------
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      # Sonia: app/kajy.jks (ao anaty project, tsy miova) no ampiasaina foana.
      # Tsy ilaina ny GitHub Secrets. Ilaina ny sonia mba ho azo apetraka ny APK (Android tsy mandray APK tsy misy sonia),
      # ary satria tsy miova ny sonia dia azo vaoana ambonin'ny dikan-teny teo aloha.
      - name: Check keystore
        run: test -f app/kajy.jks || { echo "::error::Tsy hita ny app/kajy.jks ao amin'ny project"; exit 1; }

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload test report (raha tsy nety)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Fanamarinana ny sonia (miantoka fa azo apetraka)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | head -12
          ls -lh app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: KAJY-apk
          path: app/build/outputs/apk/release/*.apk
          compression-level: 0
          if-no-files-found: error
