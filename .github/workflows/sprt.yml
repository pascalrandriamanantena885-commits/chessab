name: SPRT (vaovao vs taloha) - matrix
on:
  workflow_dispatch:
    inputs:
      base_tgz:
        description: "Dikan-teny taloha (anaran'ny .tgz). Foana = faharoa farany araka ny sort -V"
        required: false
        default: ""
      opts_base:
        description: "Safidy UCI an'ny taloha (ohatra HashBits=19)"
        required: false
        default: ""
      opts_new:
        description: "Safidy UCI an'ny vaovao (ohatra ProbCut=1,CaptHist=1). Azo atao ny tgz mitovy raha misy safidy"
        required: false
        default: ""
      shards:
        description: "Job miaraka (JSON), ohatra [0,1,2,3]"
        default: "[0,1,2,3]"
      games:
        description: "Lalao isaky ny job (isa mifandimby)"
        default: "300"
      movetime:
        description: "ms isaky ny hetsika"
        default: "100"
      elo0:
        description: "H0 (Elo)"
        default: "0"
      elo1:
        description: "H1 (Elo)"
        default: "10"
      alpha_beta:
        description: "alpha = beta (0.05 henjana, 0.1 haingana)"
        default: "0.05"
      start_game:
        description: "Hitohy: laharana lalao voalohany (jereo 'Hitohy' amin'ny summary teo aloha)"
        default: "0"
      prior:
        description: "Hitohy: W,D,L teo aloha (ohatra 320,290,290), foana raha vaovao"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  perft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract new
        run: |
          NEW=$(ls project*.tgz 2>/dev/null | sort -V | tail -1)
          [ -n "$NEW" ] || { echo "::error::Tsy hita ny project*.tgz"; exit 1; }
          mkdir new && tar xzf "$NEW" -C new
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Perft gate (mijanona raha diso ny movegen)
        run: |
          set -e
          mkdir cls_new
          javac -d cls_new new/app/src/main/java/mg/chess/offline/own/*.java new/tools/Perft.java
          java -cp cls_new mg.chess.offline.own.Perft | tee perft.txt
          { echo '### Perft (vaovao)'; echo '```'; grep PERFT_SUMMARY perft.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  sprt:
    needs: perft
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract base + new
        env:
          BASE_IN: ${{ github.event.inputs.base_tgz }}
          OPTS_B: ${{ github.event.inputs.opts_base }}
          OPTS_N: ${{ github.event.inputs.opts_new }}
        run: |
          set -e
          LIST=$(ls project*.tgz 2>/dev/null | sort -V)
          NEW=$(echo "$LIST" | tail -1)
          if [ -n "$BASE_IN" ]; then BASE="$BASE_IN"; else BASE=$(echo "$LIST" | tail -2 | head -1); fi
          if [ -z "$NEW" ] || [ -z "$BASE" ]; then echo "::error::Tsy hita ny project*.tgz"; ls -la; exit 1; fi
          if [ "$NEW" = "$BASE" ] && [ -z "$OPTS_B$OPTS_N" ]; then
            echo "::error::Mila project*.tgz roa samy hafa, na safidy (opts_base/opts_new) samy hafa"; ls -la; exit 1
          fi
          echo "BASE=$BASE  NEW=$NEW"
          mkdir base new
          tar xzf "$BASE" -C base
          tar xzf "$NEW" -C new

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Install python-chess
        run: pip install chess

      - name: Compile base + new
        run: |
          set -e
          mkdir cls_base cls_new
          javac -d cls_base base/app/src/main/java/mg/chess/offline/own/*.java base/tools/OwnUci.java
          javac -d cls_new  new/app/src/main/java/mg/chess/offline/own/*.java  new/tools/OwnUci.java

      - name: SPRT shard ${{ matrix.shard }}
        env:
          GAMES: ${{ github.event.inputs.games }}
          START: ${{ github.event.inputs.start_game }}
        run: |
          FIRST=$(( START + ${{ matrix.shard }} * GAMES ))
          python3 new/tools/sprt.py cls_base cls_new \
            --first-game "$FIRST" --games "$GAMES" \
            --movetime "${{ github.event.inputs.movetime }}" \
            --opts-base "${{ github.event.inputs.opts_base }}" \
            --opts-new "${{ github.event.inputs.opts_new }}" \
            --workers 2 --out sprt-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: sprt-${{ matrix.shard }}
          path: sprt-${{ matrix.shard }}.json

  summary:
    needs: sprt
    if: always() && needs.sprt.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract new
        run: |
          NEW=$(ls project*.tgz | sort -V | tail -1)
          mkdir new && tar xzf "$NEW" -C new
      - uses: actions/download-artifact@v4
        with:
          pattern: sprt-*
          path: results
          merge-multiple: true
      - name: Fitambarana LLR
        run: |
          python3 new/tools/sprt.py --aggregate results \
            --elo0 "${{ github.event.inputs.elo0 }}" --elo1 "${{ github.event.inputs.elo1 }}" \
            --alpha "${{ github.event.inputs.alpha_beta }}" --beta "${{ github.event.inputs.alpha_beta }}" \
            --prior "${{ github.event.inputs.prior }}"
